name: Build and release ServerHub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serverhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package exact resource-pack assets
        run: python3 tools/package_pack.py
      - name: Compile, test and verify both platform entrypoints
        run: mvn -B -ntp clean verify
      - name: Validate and assemble release assets
        run: python3 tools/prepare_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ServerHub-build
          path: dist/*
          if-no-files-found: error
      - name: Publish the requested release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version=$(cat release-version.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; published assets remain unchanged."
            exit 0
          fi
          gh release create "$tag" \
            "dist/ServerHub-$version.jar" \
            "dist/serverhub-pack.zip" \
            "dist/serverhub-pack.sha1" \
            "dist/ServerHub-$version-Komplettpaket.zip" \
            "dist/SHA256SUMS.txt" \
            "dist/PRUEFUNG.txt" \
            "dist/Menue-Vorschau.png" \
            --target "$GITHUB_SHA" \
            --title "ServerHub $version – Universal-JAR und HTTPS-Paket" \
            --notes-file RELEASE-NOTES.md \
            --latest

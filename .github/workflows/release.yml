name: Build and release ServerHub

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serverhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package exact resource-pack assets
        run: python3 tools/package_pack.py
      - name: Compile, test and verify both platform entrypoints
        run: mvn -B -ntp clean verify
      - name: Validate and assemble release assets
        run: python3 tools/prepare_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ServerHub-build
          path: dist/*
          if-no-files-found: error
      - name: Publish the requested release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version=$(cat release-version.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; published assets remain unchanged."
            exit 0
          fi
          gh release create "$tag" \
            "dist/ServerHub-$version.jar" \
            "dist/serverhub-pack.zip" \
            "dist/serverhub-pack.sha1" \
            "dist/ServerHub-$version-Komplettpaket.zip" \
            "dist/SHA256SUMS.txt" \
            "dist/PRUEFUNG.txt" \
            "dist/Menue-Vorschau.png" \
            --target "$GITHUB_SHA" \
            --title "ServerHub $version – Native Dialoge und automatische Serverliste" \
            --notes-file RELEASE-NOTES.md \
            --latest
      - name: Verify public release downloads
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version=$(cat release-version.txt)
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version"
          mkdir -p verified-release
          for asset in "ServerHub-$version.jar" serverhub-pack.zip serverhub-pack.sha1 SHA256SUMS.txt; do
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 \
              --proto '=https' --proto-redir '=https' \
              --output "verified-release/$asset" \
              --write-out "$asset: HTTP %{http_code}, %{num_redirects} redirects, %{size_download} bytes\n" \
              "$base/$asset"
          done
          (cd verified-release && sha256sum --check SHA256SUMS.txt)
          cmp dist/serverhub-pack.zip verified-release/serverhub-pack.zip
          cmp dist/serverhub-pack.sha1 verified-release/serverhub-pack.sha1
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path('verified-release')
          version = Path('release-version.txt').read_text().strip()
          pack = (root / 'serverhub-pack.zip').read_bytes()
          digest = hashlib.sha1(pack).hexdigest()
          assert digest == (root / 'serverhub-pack.sha1').read_text().strip(), 'Public pack SHA-1 mismatch'
          with zipfile.ZipFile(root / f'ServerHub-{version}.jar') as jar:
              assert jar.read('serverhub-pack.zip') == pack, 'Published JAR embeds a different pack'
              assert json.loads(jar.read('velocity-plugin.json'))['version'] == version
              assert f'version: {version}' in jar.read('plugin.yml').decode()
              for entry in ('de/serverhub/paper/ServerHubPaper.class', 'de/serverhub/velocity/ServerHubVelocity.class'):
                  assert entry in jar.namelist(), f'Missing entrypoint: {entry}'
              assert not any(n.startswith(('org/bukkit/', 'com/velocitypowered/api/')) for n in jar.namelist())
          print(f'Public release downloads verified; pack SHA-1 {digest}')
          PYVERIFY

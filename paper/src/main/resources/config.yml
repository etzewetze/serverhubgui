# Paper 26.3 / Java 25. Auf jedem Backend installieren.
# Paketpflicht und Paket-Download werden zentral von ServerHub-Velocity verwaltet.
interface-version: 2
network:
  # Erkennt vorhandenes Paper-/Spigot-Forwarding automatisch. Keine Backend-Anpassung nötig.
  # proxy erzwingt Netzwerkbetrieb; standalone deaktiviert die Netzwerk-Auswahl.
  mode: auto
server-discovery:
  # Alle bei Velocity registrierten Server automatisch übernehmen.
  enabled: true
menu:
  title: "SERVERAUSWAHL"
  title-color: "#3D2817"
  # Unterstützte echte Bitmap-Schriftgrößen: 8, 10, 12 Pixel.
  font-size: 12
  text-color: "#FFF4D6"
  previous: "Zurück"
  close: "Schließen"
  next: "Weiter"
hotbar-icon:
  # Optionaler zusätzlicher Gegenstand IN der Hotbar. Der HUD-Hinweis braucht ihn nicht.
  enabled: false
  # 0 = ganz links; 8 = ganz rechts. Belegte Gegenstände werden sicher umgelagert.
  # Ist das Inventar voll, wird kein vorhandener Gegenstand überschrieben.
  slot: 8
shift-f-hint:
  enabled: true
  # Grafischer Shift/+/F-Hinweis rechts neben der Hotbar (Actionbar-Font).
  interval-seconds: 1
  # GUI-Pixel ab Bildschirmmitte; positive y-Werte verschieben nach unten.
  x-offset: 106
  y-offset: 0
proxy:
  # Bei fehlendem Proxy-Modul bleibt das Custom-Menü gesperrt; danach Kick.
  handshake-timeout-seconds: 30
messages:
  no-permission: "&cDafür hast du keine Berechtigung."
  reloaded: "&aServerHub wurde neu geladen."
  reload-failed: "&cKonfiguration ungültig. Die bisherige Konfiguration bleibt aktiv. Details in der Konsole."
  discovering: "&eDie Serverliste wird gerade vom Proxy geladen. Bitte gleich erneut öffnen."
  loading: "&eDas erforderliche Menüpaket wird noch geladen."
  proxy-missing: "&cDie Verbindung zum ServerHub-Proxy fehlt. Bitte informiere das Serverteam."
  full-inventory: "&eFür das Menü-Icon fehlt ein freier Inventarplatz. Shift + F funktioniert weiterhin."
  unavailable: "&cDieser Server ist gerade nicht erreichbar."
  already-connected: "&eDu bist bereits auf diesem Server."
  denied: "&cDer Proxy hat den Wechsel nicht erlaubt."
# Automatische Erkennung ist Standard. Hier sind nur optionale Anpassungen nötig.
# target muss genau dem Namen in Velocity entsprechen. Nicht registrierte Ziele werden
# im Automatikmodus ausgeblendet. hidden: true blendet ein Ziel aus.
# Beispiel:
# servers:
#   lobby:
#     name: 'Lobby'
#     target: lobby
#     color: '#A8E091'
#     font-size: 12
#     description: ['Treffpunkt für alle Spieler']
#     permission: serverhub.lobby
#     hidden: false
servers: {}

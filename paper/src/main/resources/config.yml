# Paper 26.3 / Java 25. Auf jedem Backend installieren.
# Paketpflicht und Paket-Download werden zentral von ServerHub-Velocity verwaltet.
menu:
  title: "SERVERAUSWAHL"
  title-color: "#E8C78F"
  # Unterstützte echte Bitmap-Schriftgrößen: 8, 10, 12 Pixel.
  font-size: 10
  text-color: "#FFF4D6"
  previous: "Zurück"
  close: "Schließen"
  next: "Weiter"
hotbar-icon:
  enabled: true
  # 0 = ganz links; 8 = ganz rechts. Belegte Gegenstände werden sicher umgelagert.
  # Ist das Inventar voll, wird kein vorhandener Gegenstand überschrieben.
  slot: 8
shift-f-hint:
  enabled: true
  # Dezente Actionbar; im Vanilla-Client oberhalb der Hotbar zentriert.
  interval-seconds: 5
  text: "&#D9BF89Shift + F &8· &7Servermenü"
proxy:
  # Bei fehlendem Proxy-Modul bleibt das Custom-Menü gesperrt; danach Kick.
  handshake-timeout-seconds: 30
messages:
  no-permission: "&cDafür hast du keine Berechtigung."
  reloaded: "&aServerHub wurde neu geladen."
  reload-failed: "&cKonfiguration ungültig. Die bisherige Konfiguration bleibt aktiv. Details in der Konsole."
  loading: "&eDas erforderliche Menüpaket wird noch geladen."
  proxy-missing: "&cDie Verbindung zum ServerHub-Proxy fehlt. Bitte informiere das Serverteam."
  full-inventory: "&eFür das Menü-Icon fehlt ein freier Inventarplatz. Shift + F funktioniert weiterhin."
  unavailable: "&cDieser Server ist gerade nicht erreichbar."
  already-connected: "&eDu bist bereits auf diesem Server."
  denied: "&cDer Proxy hat den Wechsel nicht erlaubt."
# target muss dem tatsächlichen Namen in velocity.toml entsprechen, nicht nur
# einem Befehlsalias eines anderen Plugins. Reihenfolge = Reihenfolge im Menü.
# name: Klartext; color: Hex. permission: optional, wird auf Paper geprüft.
# Optional font-size: 8/10/12 pro Eintrag; zu lange Namen werden gekürzt,
# der vollständige Name und die Beschreibung bleiben im Tooltip erhalten.
servers:
  lobby:
    name: "Lobby"
    target: lobby
    color: "#A8E091"
    description: ["Treffpunkt für alle Spieler"]
  survival:
    name: "Survival"
    target: survival
    color: "#F2C06D"
    description: ["Gemeinsam überleben und bauen"]
  creative:
    name: "Creative"
    target: creative
    color: "#9FDCF0"
    description: ["Deinen Ideen freien Lauf lassen"]
  test:
    name: "Testserver"
    target: test
    color: "#D6AFF0"
    permission: serverhub.test
    description: ["Neue Funktionen ausprobieren"]
  kalle:
    name: "Kalle"
    target: kalle
    color: "#F0A79A"
    description: ["Zu Kalles Server wechseln"]

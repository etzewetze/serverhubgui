name: ServerHubPaper
version: 2.5.2
main: de.serverhub.paper.ServerHubPaper
api-version: '26.3'
description: Stein-/Holz-Servermenü mit Pflichtpaket über ServerHub-Velocity
authors: [ServerHub]
commands:
  extramenu:
    aliases: [extramenü, extramen, serverhub, sh]
    description: Serverauswahl öffnen oder mit reload neu laden
    usage: /extramenu [reload|news start [--server Ziel] Nachricht|news stop [--server Ziel]]
softdepend: [PlaceholderAPI]
permissions:
  serverhub.news:
    default: op
  serverhub.use:
    default: true
  serverhub.reload:
    default: op
  serverhub.test:
    default: op

# ServerHub 2.5.0 – identische JAR auf Velocity und Paper verwenden.
configuration-version=3
# github: fertige ZIP per HTTPS aus dem versionsgebundenen GitHub-Release.
# Kein eigener HTTP-Port und keine manuell einzutragende Downloadadresse nötig.
# auto: unverändertes Paket per GitHub; eigene pack/-Inhalte automatisch per self-host.
# Für eigene Inhalte muss der öffentliche Pack-Port erreichbar sein. Alternativen: external oder self-host.
pack.mode=auto
pack.file=serverhub-pack.zip
pack.external-url=
pack.timeout-seconds=120
pack.prompt=Dieses Netzwerk benötigt das ServerHub-Menüpaket. Es wird einmal pro Netzwerkbeitritt angeboten.
pack.kick=Das ServerHub-Menüpaket ist erforderlich. Der Download ist fehlgeschlagen oder wurde abgelehnt. Bitte informiere das Serverteam.
# Nur im Modus self-host: eigener HTTP-Server AUF DEM VELOCITY-HOST.
# Port 8124 kollidiert nicht mit dem ExtraItems-Standardport 8123.
self-host.bind=0.0.0.0
self-host.port=8124
self-host.public-host=auto
self-host.scheme=http
self-host.advertised-port=8124
# auto verwendet den Hostnamen, mit dem der Spieler Velocity betreten hat.
# Bei SRV, Tunnels, Reverse-Proxy oder Port-Mapping den öffentlichen Host/Port setzen.
# Bind/Port/Modus ändern: Proxy neu starten. Kein erneutes Angebot durch Reload.
